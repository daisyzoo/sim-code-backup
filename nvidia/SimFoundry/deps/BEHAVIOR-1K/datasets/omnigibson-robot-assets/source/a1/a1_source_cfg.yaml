        "radius": 0.0075
      - "center": [0.042, -0.014, 0.0175 ]
        "radius": 0.0055
      - "center": [0.057, -0.014, 0.0152 ]
        "radius": 0.0035
      - "center": [0.069, -0.014, 0.0135 ]
